<div class="dashboard">
  <div class="dashboard-sub">
    <div class="dashboard-header">
      <div>
        <h1>Maintenance Dashboard</h1>
      </div>
      <div class="header-actions">
        <button mat-stroked-button color="primary" class="action-btn" type="button" (click)="openTestImportDialog()">
          <mat-icon>upload</mat-icon>
          Import File
        </button>
        <button mat-stroked-button class="action-btn refresh-btn" type="button" (click)="refetch()">
          <mat-icon>refresh</mat-icon>
          Refresh
        </button>
      </div>
    </div>

    <div class="stats-grid">
      <app-stat-card 
        *ngFor="let stat of statCards()"
        [title]="stat.title"
        [value]="stat.value"
        [trend]="stat.trend"
        [changePercentage]="stat.changePercentage"
        [changeDirection]="stat.changeDirection"
        [loading]="stat.loading">
      </app-stat-card>
    </div>

    <div class="charts-row">
      <div class="chart-column">
        <app-work-order-chart
          [statuses]="statusChartData()"
          [loading]="isLoading()">
        </app-work-order-chart>
      </div>
      <div class="chart-column">
        <app-cost-chart
          [data]="costChartItems()"
          [axisLabel]="costAxisLabel()"
          [loading]="isLoading()">
        </app-cost-chart>
      </div>
    </div>

    <app-work-order-table
      [externalWorkOrders]="recentWorkOrders()"
      [loading]="isLoading()"
      [showEditDelete]="false"
      [emptyMessage]="'No recent work orders.'">
    </app-work-order-table>

    <app-service-request-table
      [requests]="recentServiceRequests()"
      [loading]="isLoading()"
      [emptyMessage]="'No recent service requests.'">
    </app-service-request-table>
  </div>
</div>
