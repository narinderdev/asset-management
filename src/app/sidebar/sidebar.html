<div class="sidebar" [class.collapsed]="isCollapsed" [class.mobile-open]="mobileOpen">
  <!-- User Profile -->
  <div class="user-profile brand-row">
    <div class="brand">
      <img
        [src]="isCollapsed ? '/assets/icons/fav-icon.svg' : '/assets/icons/logo1.svg'"
        alt="Brand Logo"
        class="brand-logo"
      />
    </div>
    <button class="toggle-btn" (click)="toggleSidebar()" *ngIf="!isCollapsed">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6" />
      </svg>
    </button>
  </div>

  <button
    class="toggle-btn collapsed-toggle"
    (click)="toggleSidebar()"
    *ngIf="isCollapsed"
    aria-label="Expand sidebar"
  >
    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <polyline points="9 6 15 12 9 18" />
    </svg>
  </button>

  <!-- Navigation Menu -->
  <nav class="sidebar-nav">
    <ul class="menu-list">
      <li
        *ngFor="let item of menuItems"
        class="menu-item"
        [class.has-submenu]="item.hasSubmenu"
        [class.active]="isMenuItemActive(item)"
      >
        <a
          href="#"
          class="menu-link"
          (click)="handleMenuClick(item, $event)"
          [class.active]="isMenuItemActive(item)"
        >
          <img
            [src]="getMenuIconPath(item)"
            [alt]="item.label"
            class="menu-icon"
          />
          <span class="menu-label" *ngIf="!isCollapsed">{{ item.label }}</span>
          <svg
            *ngIf="item.hasSubmenu && !isCollapsed"
            class="menu-arrow"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <polyline points="6 9 12 15 18 9" />
          </svg>
        </a>

        <ul
          class="submenu"
          *ngIf="item.hasSubmenu && expandedMenuLabel === item.label && !isCollapsed"
        >
          <li
            *ngFor="let sub of item.submenu || []"
            class="submenu-item"
            [class.active]="isSubmenuActive(sub)"
          >
            <a
              href="#"
              class="submenu-link"
              [class.active]="isSubmenuActive(sub)"
              (click)="selectSubmenu(sub, $event)"
            >
              {{ sub.label }}
            </a>
          </li>
        </ul>
      </li>
    </ul>
  </nav>

  <div class="sidebar-footer">
    <div class="mini-user" *ngIf="!isCollapsed">
      <div class="mini-avatar">{{ userName ? userName.charAt(0) : 'U' }}</div>
      <span class="mini-name">{{ userName }}</span>
    </div>
    <div class="mini-user collapsed-avatar" *ngIf="isCollapsed">
      <div class="mini-avatar">{{ userName ? userName.charAt(0) : 'U' }}</div>
    </div>
    <button class="signout-btn" (click)="signOut()" aria-label="Sign out">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M14 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h8" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M9 12h11m0 0-3-3m3 3-3 3" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span class="signout-label" *ngIf="!isCollapsed">Log Out</span>
    </button>
  </div>

</div>

<div class="logout-modal-backdrop" *ngIf="showLogoutModal">
  <div class="logout-modal">
    <p>Are you sure you want to logout?</p>
    <div class="logout-actions">
      <button type="button" class="logout-btn secondary" (click)="cancelLogout()">No</button>
      <button type="button" class="logout-btn primary" (click)="confirmLogout()">Yes</button>
    </div>
  </div>
</div>
