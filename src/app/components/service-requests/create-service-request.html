<div class="create-request-page">
  <section class="create-card">
        <header class="create-header">
      <button
        type="button"
        class="back-btn"
        aria-label="Back to service requests"
        (click)="onCancel()"
      >
        &larr;
      </button>
      <h2>{{ isEditMode ? 'Edit Service Request' : 'Create Service Request' }}</h2>
    </header>


    <div class="form-loading" *ngIf="isEditMode && isLoadingDetails">
      <div class="loading-indicator"></div>
      <span>Loading request...</span>
    </div>

    <form
      class="request-form"
      (ngSubmit)="onCreate()"
      *ngIf="!isEditMode || hasLoadedDetails"
    >
      <div class="form-grid">
        <label class="field">
          <div class="field-label-row">
            <span>Request ID</span>
            <div class="auto-generate-control" *ngIf="!isEditMode">
              <input
                type="checkbox"
                name="autoGenerateRequestId"
                [(ngModel)]="autoGenerateRequestId"
                (change)="onAutoGenerateRequestIdChange()"
              />
              <span>Auto-generate</span>
            </div>
          </div>
          <input
            type="text"
            name="requestId"
            [(ngModel)]="request.requestId"
            [disabled]="isEditMode || autoGenerateRequestId"
          />
        </label>
        <label class="field">
          <span>Request Date</span>
          <input type="date" name="requestDate" [(ngModel)]="request.requestDate" />
        </label>
        <label class="field">
          <span>Requester Name *</span>
          <input
            type="text"
            name="requesterName"
            [(ngModel)]="request.requesterName"
            placeholder="Select User"
          />
        </label>
        <label class="field">
          <span>Requester Contact</span>
          <input type="text" name="requesterContact" [(ngModel)]="request.requesterContact" placeholder="Email or Phone" />
        </label>
        <label class="field">
          <span>Department</span>
          <select name="department" [(ngModel)]="request.department">
            <option value="" disabled hidden>Select Department</option>
            <option *ngFor="let department of departmentOptions" [value]="department">{{ department }}</option>
          </select>
        </label>
        <label class="field">
          <span>Asset (Optional)</span>
          <select name="asset" [(ngModel)]="request.asset" [disabled]="!assetOptions.length">
            <option value="" disabled>
              {{ assetOptions.length ? 'Select Asset' : 'No assets available' }}
            </option>
            <option *ngFor="let asset of assetOptions" [value]="asset.id">{{ asset.label }}</option>
          </select>
        </label>
        <label class="field">
          <span>Location</span>
          <input type="text" name="location" [(ngModel)]="request.location" placeholder="Enter location" />
        </label>
        <label class="field">
          <span>Maintenance Type</span>
          <select name="maintenanceType" [(ngModel)]="request.maintenanceType">
            <option value="" disabled hidden>Select Type</option>
            <option *ngFor="let type of maintenanceOptions" [value]="type.value">{{ type.label }}</option>
          </select>
        </label>
        <label class="field">
          <span>Priority</span>
          <select name="priority" [(ngModel)]="request.priority">
            <option value="" disabled hidden>Select Priority</option>
            <option *ngFor="let priority of priorityOptions" [value]="priority.value">{{ priority.label }}</option>
          </select>
        </label>
        <label class="field">
          <span>Short Title *</span>
          <input
            type="text"
            name="shortTitle"
            [(ngModel)]="request.shortTitle"
            placeholder="Brief description of the issue"
          />
        </label>
        <label class="field">
          <span>Problem Description *</span>
          <input
            type="text"
            name="problemDescription"
            [(ngModel)]="request.problemDescription"
          
            placeholder="Detailed description of the problem"
          />
        </label>
        <label class="field">
          <span>Preferred Date</span>
          <input type="date" name="preferredDate" [(ngModel)]="request.preferredDate" />
        </label>
        <label class="field">
          <span>Preferred Time</span>
          <input type="time" name="preferredTime" [(ngModel)]="request.preferredTime" />
        </label>
        <label class="field">
          <span>Status</span>
          <select name="status" [(ngModel)]="request.status">
            <option value="" disabled hidden>Select Status</option>
            <option *ngFor="let status of statusOptions" [value]="status.value">{{ status.label }}</option>
          </select>
        </label>
      </div>

      <label class="checkbox-field">
        <input type="checkbox" name="safetyRisk" [(ngModel)]="request.safetyRisk" />
        <span>Safety Risk?</span>
      </label>

      <div *ngIf="errorMessage" class="form-error">
        {{ errorMessage }}
      </div>

      <div class="form-actions">
        <button type="button" class="btn ghost" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn primary" [disabled]="isSubmitting">
          {{ isSubmitting ? (isEditMode ? 'Updating...' : 'Creating...') : (isEditMode ? 'Update Service Request' : 'Create Service Request') }}
        </button>
      </div>
    </form>
  </section>
</div>
