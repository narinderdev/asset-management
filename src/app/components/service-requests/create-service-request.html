<div class="create-request-page">
  <section class="create-card">
    <header class="create-header">
      <button type="button" class="back-btn" aria-label="Back to service requests" (click)="onCancel()">
        &larr;
      </button>
      <h2>{{ isEditMode ? 'Edit Service Request' : 'Create Service Request' }}</h2>
    </header>


    <div class="form-loading" *ngIf="isEditMode && isLoadingDetails">
      <div class="loading-indicator"></div>
      <span>Loading request...</span>
    </div>

    <form class="request-form" (ngSubmit)="onCreate()" *ngIf="!isEditMode || hasLoadedDetails">
      <div class="form-grid">
        <label class="field">
          <div class="field-label-row">
            <span>Request ID</span>
            <div class="auto-generate-control" *ngIf="!isEditMode">
              <input type="checkbox" name="autoGenerateRequestId" [(ngModel)]="autoGenerateRequestId"
                (change)="onAutoGenerateRequestIdChange()" />
              <span>Auto-generate</span>
            </div>
          </div>
          <input type="text" name="requestId" [(ngModel)]="request.requestId"
            [disabled]="isEditMode || autoGenerateRequestId" />
        </label>
        <!-- <label class="field">
          <span>Request Date</span>
          <input type="date" name="requestDate" [(ngModel)]="request.requestDate" />
        </label> -->
        <label class="field">
          <span>Requester Name *</span>
          <input type="text" name="requesterName" [(ngModel)]="request.requesterName" placeholder="Select User" />
        </label>
        <label class="field">
          <span>Requester Contact</span>
          <input type="text" name="requesterContact" [(ngModel)]="request.requesterContact"
            placeholder="Email or Phone" />
        </label>
        <label class="field">
          <span>Department</span>
          <input type="text" name="department" [(ngModel)]="request.department" placeholder="Enter department" />
        </label>
        <label class="field">
          <span>Asset</span>
          <select name="asset" [(ngModel)]="request.asset" (ngModelChange)="onAssetChange($event)" [disabled]="!assetOptions.length">
            <option value="" disabled>
              {{ assetOptions.length ? 'Select Asset' : 'No assets available' }}
            </option>
            <option *ngFor="let asset of assetOptions" [value]="asset.id">{{ asset.label }}</option>
          </select>
        </label>
        <label class="field">
          <span>Location</span>
          <input type="text" name="location" [(ngModel)]="request.location" placeholder="Enter location" [disabled]="true" />
        </label>
        <label class="field">
          <span>Maintenance Type</span>
          <select name="maintenanceType" [(ngModel)]="request.maintenanceType">
            <option value="" disabled hidden>Select Type</option>
            <option *ngFor="let type of maintenanceOptions" [value]="type.value">{{ type.label }}</option>
          </select>
        </label>
        <label class="field">
          <span>Priority</span>
          <select name="priority" [(ngModel)]="request.priority">
            <option value="" disabled hidden>Select Priority</option>
            <option *ngFor="let priority of priorityOptions" [value]="priority.value">{{ priority.label }}</option>
          </select>
        </label>
        <label class="field">
          <span>Short Title *</span>
          <input type="text" name="shortTitle" [(ngModel)]="request.shortTitle"
            placeholder="Brief description of the issue" />
        </label>
        <label class="field">
          <span>Problem Description *</span>
          <input type="text" name="problemDescription" [(ngModel)]="request.problemDescription"
            placeholder="Detailed description of the problem" />
        </label>
        <label class="field">
          <span>Total Days Required to Complete</span>
          <input type="number" name="totalDaysRequired" min="1" step="1"
            [(ngModel)]="request.totalDaysRequired"
            (ngModelChange)="onTotalDaysChange()"
            placeholder="Enter total days" />
        </label>
        <label class="field assignment-field">
          <span>Assignment</span>
          <div class="assignment-options">
            <label class="radio-option">
              <input type="radio" name="assignmentMode" value="TECHNICIAN"
                [(ngModel)]="request.assignmentMode"
                (ngModelChange)="onAssignmentModeChange('TECHNICIAN')" />
              <span>Technician</span>
            </label>
            <label class="radio-option">
              <input type="radio" name="assignmentMode" value="TEAM"
                [(ngModel)]="request.assignmentMode"
                (ngModelChange)="onAssignmentModeChange('TEAM')" />
              <span>Team</span>
            </label>
          </div>
        </label>
        <label class="field">
          <span>{{ request.assignmentMode === 'TEAM' ? 'Team' : 'Technician' }}</span>
          <select
            *ngIf="request.assignmentMode === 'TECHNICIAN'"
            [(ngModel)]="request.preferredTechnicianId"
            name="preferredTechnicianId"
            (ngModelChange)="onTechnicianChange($event)">
            <option [ngValue]="undefined" disabled hidden>Select technician</option>
            <option *ngFor="let tech of technicianOptions" [ngValue]="getTechnicianId(tech)">
              {{ getTechnicianName(tech) }}
            </option>
          </select>
          <select
            *ngIf="request.assignmentMode === 'TEAM'"
            [(ngModel)]="request.preferredTeamId"
            name="preferredTeamId"
            (ngModelChange)="onTeamChange($event)">
            <option [ngValue]="undefined" disabled hidden>Select team</option>
            <option *ngFor="let team of teamOptions" [ngValue]="team.id">
              {{ team.teamName || ('Team #' + team.id) }}
            </option>
          </select>
        </label>
        <label class="field">
          <span>Scheduled Time</span>
          <select class="form-input"
            [(ngModel)]="selectedAvailabilityIndex"
            name="selectedAvailabilityIndex"
            (ngModelChange)="onAvailabilitySelected($event)"
            [disabled]="availabilityLoading || !availabilityOptions.length">
            <option [ngValue]="undefined" disabled hidden>Select availability</option>
            <option *ngFor="let slot of availabilityOptions; index as i" [ngValue]="i">
              {{ slot.label }}
            </option>
          </select>
          <div class="helper-text" *ngIf="availabilityLoading">Loading availability...</div>
          <div class="helper-text" *ngIf="!availabilityLoading && !availabilityOptions.length">
            Choose a technician or team and set total days to load options.
          </div>
        </label>
        <!-- <label class="field">
          <span>Status</span>
          <select name="status" [(ngModel)]="request.status">
            <option value="" disabled hidden>Select Status</option>
            <option *ngFor="let status of statusOptions" [value]="status.value">{{ status.label }}</option>
          </select>
        </label> -->
      </div>

      <label class="checkbox-field">
        <input type="checkbox" name="safetyRisk" [(ngModel)]="request.safetyRisk" />
        <span>Safety Risk?</span>
      </label>

      <div *ngIf="errorMessage" class="form-error">
        {{ errorMessage }}
      </div>

      <div class="form-actions">
        <button type="button" class="btn ghost" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn primary" [disabled]="isSubmitting">
          {{ isSubmitting ? (isEditMode ? 'Updating...' : 'Creating...') : (isEditMode ? 'Update Service Request' :
          'Create Service Request') }}
        </button>
      </div>
    </form>
  </section>
</div>
