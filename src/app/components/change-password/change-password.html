<div class="change-password-container">
  <form class="change-password-card" [formGroup]="form" (ngSubmit)="submit()">
    <h2>Change Password</h2>
    <p class="subtitle">Update your current password.</p>

    <div class="error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <label>Current Password</label>
    <div class="input-wrapper">
      <input
        [type]="currentPasswordVisible ? 'text' : 'password'"
        formControlName="currentPassword"
        placeholder="Enter current password" />
      <button type="button" class="toggle-btn" (click)="togglePasswordVisibility('currentPassword')">
        {{ currentPasswordVisible ? 'Hide' : 'Show' }}
      </button>
    </div>
    <small class="error" *ngIf="submitted && form.get('currentPassword')?.errors?.['required']">
      Current password is required.
    </small>

    <label>New Password</label>
    <div class="input-wrapper">
      <input
        [type]="newPasswordVisible ? 'text' : 'password'"
        formControlName="newPassword"
        placeholder="Enter new password" />
      <button type="button" class="toggle-btn" (click)="togglePasswordVisibility('newPassword')">
        {{ newPasswordVisible ? 'Hide' : 'Show' }}
      </button>
    </div>
    <small class="error" *ngIf="submitted && form.get('newPassword')?.errors?.['required']">
      New password is required.
    </small>
    <small class="error" *ngIf="submitted && form.get('newPassword')?.errors?.['minlength']">
      New password must be at least 8 characters.
    </small>

    <label>Confirm New Password</label>
    <div class="input-wrapper">
      <input
        [type]="confirmPasswordVisible ? 'text' : 'password'"
        formControlName="confirmPassword"
        placeholder="Confirm new password" />
      <button type="button" class="toggle-btn" (click)="togglePasswordVisibility('confirmPassword')">
        {{ confirmPasswordVisible ? 'Hide' : 'Show' }}
      </button>
    </div>
    <small class="error" *ngIf="submitted && form.get('confirmPassword')?.errors?.['required']">
      Confirm password is required.
    </small>
    <small class="error" *ngIf="submitted && form.errors?.['mismatch']">
      New password and confirm password must match.
    </small>

    <button class="btn-primary" type="submit" [disabled]="loading">
      <app-spinner *ngIf="loading"></app-spinner>
      {{ loading ? 'Updating...' : 'Change Password' }}
    </button>
  </form>
</div>
