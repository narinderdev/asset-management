
<div class="chart-card">
  <h3 class="chart-title">Work Orders by Status</h3>
  
  <div class="chart-container">
    <div class="donut-chart">
      <ng-container *ngIf="!loading && statuses.length; else donutFallback">
        <svg viewBox="0 0 200 200" class="donut">
          <ng-container *ngFor="let status of statuses; let i = index; trackBy: trackByStatus">
            <circle
              cx="100"
              cy="100"
              r="70"
              fill="none"
              [attr.stroke]="status.color"
              stroke-width="25"
              class="donut-segment"
              [style.--dasharray]="dashArray(status.value)"
              [style.--dashoffset-final]="dashOffset(i)"
            ></circle>
          </ng-container>
        </svg>
      </ng-container>
    </div>
    
    <div class="chart-legend">
      <ng-container *ngIf="!loading; else legendSkeleton">
        <div class="legend-item" *ngFor="let status of statuses; trackBy: trackByStatus">
          <div class="legend-color" [style.background-color]="status.color"></div>
          <div class="legend-details">
            <div class="legend-value">{{ status.value }}</div>
            <div class="legend-label">{{ status.label }}</div>
          </div>
        </div>
        <div class="legend-item empty-legend" *ngIf="!statuses.length">
          <div class="legend-details">
            <div class="legend-label">No status data</div>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>

<ng-template #donutFallback>
  <div class="donut-placeholder" *ngIf="loading; else emptyState">
    <div class="skeleton donut-skeleton"></div>
  </div>
</ng-template>

<ng-template #legendSkeleton>
  <div class="legend-item" *ngFor="let _ of [0, 1, 2]">
    <div class="legend-color skeleton skeleton-bar"></div>
    <div class="legend-details">
      <div class="legend-value skeleton skeleton-text short"></div>
      <div class="legend-label skeleton skeleton-text shorter"></div>
    </div>
  </div>
</ng-template>

<ng-template #emptyState>
  <div class="empty-state">
    <div class="empty-icon">📊</div>
    <div class="empty-title">No work order data</div>
    <div class="empty-sub">Work orders will appear here once created or scheduled.</div>
  </div>
</ng-template>
