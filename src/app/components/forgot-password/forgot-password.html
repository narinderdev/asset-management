<div class="forgot-password-container">
  <form class="forgot-password-card" [formGroup]="requestForm" (ngSubmit)="sendResetCode()">
    <div class="logo-wrap">
      <img src="/assets/icons/logo1.svg" alt="Logo" class="auth-logo" />
    </div>
    <h2 class="title">Forgot Password</h2>
    <p class="subtitle">Enter your email and we will send you a reset code.</p>

    <div class="form-group">
      <label>Email Address</label>
      <input type="email" formControlName="email" placeholder="Enter your email" />
      <small class="error" *ngIf="submittedRequest && requestForm.get('email')?.invalid">
        Enter a valid email.
      </small>
    </div>

    <button class="btn-primary" type="submit" [disabled]="loading">
      <ng-container *ngIf="!loading; else requestLoading">Send Reset Code</ng-container>
    </button>
    <ng-template #requestLoading>
      <app-spinner></app-spinner>
    </ng-template>

    <p class="login-hint">
      Remembered your password?
      <a routerLink="/login" (mousedown)="$event.preventDefault()">Back to login</a>
    </p>
  </form>
</div>
