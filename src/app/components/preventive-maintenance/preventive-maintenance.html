<div class="preventive-wrapper">
  <div class="preventive-header">
    <h1 class="preventive-title">{{ headingText }}</h1>
    <button
      class="create-service-btn"
      *ngIf="canCreatePm"
      (click)="createServiceRequest()">
      <span class="label-full">{{ createButtonText }}</span>
      <span class="label-short">+ Create</span>
    </button>
  </div>

  <div class="table-status" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="table-wrapper" [class.has-error]="errorMessage">
    <div class="table-container">
      <table class="preventive-table">
      <thead>
        <tr>
          <th>Title</th>
          <th>Asset Name</th>
          <th>Location</th>
          <th>Start Date</th>
          <th>Priority</th>
          <th>Active</th>
          <th *ngIf="!isPredictiveMode">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="!templates.length && !isLoading">
          <td [attr.colspan]="isPredictiveMode ? 6 : 7" class="empty-row">{{ emptyStateText }}</td>
        </tr>
        <tr *ngFor="let template of templates">
          <td>{{ template.title }}</td>
          <td>{{ template.assetName }}</td>
          <td>{{ template.location }}</td>
          <td>{{ template.startDate }}</td>
          <td>{{ template.priority }}</td>
          <td>
            <span class="status-chip" [ngClass]="{ 'status-green': template.active }">
              {{ template.active ? 'Yes' : 'No' }}
            </span>
          </td>
          <td class="actions-cell" *ngIf="!isPredictiveMode">
            <button
              class="action-icon"
              aria-label="View template"
              (click)="viewTemplate(template)"
            >
              <img src="assets/icons/Vector.svg" alt="View" />
            </button>
            <button
              class="action-icon"
              aria-label="Edit template"
              *ngIf="canEditPm && !isEmergencyMode"
              (click)="editTemplate(template)"
            >
              <img src="assets/icons/edit.svg" alt="Edit" />
            </button>
            <button
              class="action-icon danger"
              aria-label="Delete template"
              *ngIf="canDeletePm && !isEmergencyMode"
              (click)="promptDeleteTemplate(template)"
            >
              <img src="assets/icons/delete.svg" alt="Delete" />
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="loading-overlay" *ngIf="isLoading">
    <div class="loader"></div>
    <span>Loading templates...</span>
  </div>

  <app-delete-modal
    [isOpen]="isDeleteModalOpen"
    title="Delete Template"
    [message]="deleteMessage"
    [deleting]="isDeleting"
    (cancel)="closeDeleteModal()"
    (confirm)="confirmDeleteTemplate()"
  ></app-delete-modal>
</div>
