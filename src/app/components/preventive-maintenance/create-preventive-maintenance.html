<div class="create-request-page">
  <section class="create-card">
    <header class="create-header">
      <button
        type="button"
        class="back-btn"
        aria-label="Back to Preventative maintenance"
        (click)="onCancel()"
      >
        &larr;
      </button>
      <h2>{{ isEditMode ? 'Edit Preventative Maintenance Template' : 'Create Preventative Maintenance Template' }}</h2>
    </header>

    <div class="status-message" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form class="request-form" (ngSubmit)="onCreate()">
      <div class="form-grid">
        <label class="field">
          <span>Apply PM Template To</span>
          <select name="applyTo" [(ngModel)]="template.applyTo" (change)="onApplyTargetChange()">
            <option value="ASSET">Asset</option>
            <option value="ASSET_TYPE">Asset Type</option>
          </select>
        </label>
        <label class="field" *ngIf="isApplyToAsset()">
          <span>Asset</span>
          <select name="assetId" [(ngModel)]="template.assetId" (change)="onAssetChange()">
            <option [ngValue]="null">Select Asset</option>
            <option *ngFor="let asset of assetOptions" [ngValue]="asset.id">
              {{ asset.label }}
            </option>
          </select>
        </label>
        <label class="field" *ngIf="isApplyToAssetType()">
          <span>Asset Type</span>
          <select name="assetTypeId" [(ngModel)]="template.assetTypeId">
            <option [ngValue]="null">Select Asset Type</option>
            <option *ngFor="let type of assetTypeOptions" [ngValue]="type.id">
              {{ type.label }}
            </option>
          </select>
        </label>
        <label class="field">
          <span>Title <span class="required-star">*</span></span>
          <input
            type="text"
            name="title"
            [(ngModel)]="template.title"
            placeholder="e.g., Quarterly Inspection - Transformer"
            required
          />
        </label>
        <label class="field">
          <span>Priority <span class="required-star">*</span></span>
          <select name="priority" [(ngModel)]="template.priority" required>
            <option value="" disabled hidden>Select Priority</option>
            <option *ngFor="let priority of priorityOptions" [value]="priority.value">
              {{ priority.label }}
            </option>
          </select>
        </label>

          <label class="field">
            <span>Location</span>
            <input
              type="text"
              name="location"
              [(ngModel)]="template.location"
              placeholder="e.g., Building 1 - Floor 2"
              [disabled]="true"
            />
          </label>
        <label class="field">
          <span>Start Date</span>
          <input type="date" name="startDate" [(ngModel)]="template.startDate" placeholder="dd-mm-yyyy" />
        </label>

        <label class="field">
          <span>Schedule Type <span class="required-star">*</span></span>
          <select name="scheduleType" [(ngModel)]="template.scheduleType" required>
            <option value="" disabled hidden>Select Type</option>
            <option *ngFor="let schedule of scheduleTypeOptions" [value]="schedule.value">
              {{ schedule.label }}
            </option>
          </select>
        </label>
        <label class="field" *ngIf="isTimeBased()">
          <span>Interval Unit <span class="required-star">*</span></span>
          <select name="intervalUnit" [(ngModel)]="template.intervalUnit" required>
            <option value="" disabled hidden>Select Unit</option>
            <option *ngFor="let unit of intervalUnitOptions" [value]="unit.value">
              {{ unit.label }}
            </option>
          </select>
        </label>

        <label class="field" *ngIf="isTimeBased()">
          <span>Interval Value</span>
          <input type="number" name="intervalValue" [(ngModel)]="template.intervalValue" placeholder="e.g., 30" />
        </label>
        <label class="field" *ngIf="isUsageBased()">
          <span>Meter Type</span>
          <select name="meterType" [(ngModel)]="template.meterType">
            <option *ngFor="let unit of meterTypeOptions" [value]="unit.value">
              {{ unit.label }}
            </option>
          </select>
        </label>

        <label class="field" *ngIf="isUsageBased()">
          <span>Meter Interval Value</span>
          <input
            type="number"
            name="meterIntervalValue"
            [(ngModel)]="template.meterIntervalValue"
            placeholder="e.g., 250"
          />
        </label>
        <label class="field">
          <span>Lead Time to Generate WO (Days before due date)</span>
          <input type="number" name="leadTimeDays" [(ngModel)]="template.leadTimeDays" />
        </label>

        <label class="field" *ngIf="isUsageBased()">
          <span>Current Meter Reading</span>
          <input
            type="number"
            name="currentMeterReading"
            [(ngModel)]="template.currentMeterReading"
            placeholder="e.g., 1200"
          />
        </label>
      </div>

      <div class="form-actions">
        <button type="button" class="btn ghost" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn primary" [disabled]="isSubmitting || !hasLoadedDetails">
          {{ isSubmitting ? (isEditMode ? 'Updating...' : 'Creating...') : (isEditMode ? 'Update PM Template' : 'Create PM Template') }}
        </button>
      </div>
    </form>
  </section>
</div>
