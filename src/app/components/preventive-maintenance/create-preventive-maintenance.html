<div class="create-request-page">
  <section class="create-card">
    <header class="create-header">
      <button
        type="button"
        class="back-btn"
        aria-label="Back to preventive maintenance"
        (click)="onCancel()"
      >
        ←
      </button>
      <h2>{{ isEditMode ? 'Edit Preventive Maintenance Template' : 'Create Preventive Maintenance Template' }}</h2>
    </header>

    <div class="status-message" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form class="request-form" (ngSubmit)="onCreate()">
      <div class="form-grid">
        <label class="field">
          <div class="field-label-row">
            <span>PM ID</span>
            <div class="auto-generate-control" *ngIf="!isEditMode">
              <input
                type="checkbox"
                name="autoGeneratePmId"
                [(ngModel)]="autoGeneratePmId"
                (change)="onAutoGeneratePmIdChange()"
              />
              <span>Auto-generate</span>
            </div>
          </div>
          <input
            type="text"
            name="pmId"
            [(ngModel)]="template.pmId"
            [disabled]="isEditMode || autoGeneratePmId"
          />
        </label>
        <label class="field">
          <span>PM Name <span class="required-star">*</span></span>
          <input
            type="text"
            name="pmName"
            [(ngModel)]="template.pmName"
            placeholder="e.g., Quarterly Inspection - Transformer"
          />
        </label>
        <label class="field">
          <span>PM Type <span class="required-star">*</span></span>
          <select name="pmType" [(ngModel)]="template.pmType">
            <option value="" disabled hidden>Select Type</option>
            <option *ngFor="let type of pmTypeOptions" [value]="type.value">
              {{ type.label }}
            </option>
          </select>
        </label>

        <label class="field">
          <span>Applies To <span class="required-star">*</span></span>
          <select name="appliesTo" [(ngModel)]="template.appliesToType">
            <option value="" disabled hidden>Select</option>
            <option *ngFor="let target of appliesToOptions" [value]="target.value">
              {{ target.label }}
            </option>
          </select>
        </label>
        <label class="field">
          <span>Asset (Optional)</span>
          <select name="asset" [(ngModel)]="template.assetDbId">
            <option [ngValue]="null">Select Asset</option>
            <option *ngFor="let asset of assetOptions" [ngValue]="asset.id">
              {{ asset.label }}
            </option>
          </select>
        </label>
        <label class="field">
          <span>Asset Category</span>
          <input type="text" name="assetCategory" [(ngModel)]="template.assetCategory" />
        </label>

        <label class="field">
          <span>Plan Start Date</span>
          <input type="date" name="planStartDate" [(ngModel)]="template.planStartDate" />
        </label>
        <label class="field">
          <span>Plan End Date (Optional)</span>
          <input type="date" name="planEndDate" [(ngModel)]="template.planEndDate" />
        </label>

        <label class="field">
          <span>Frequency Type <span class="required-star">*</span></span>
          <select name="frequencyType" [(ngModel)]="template.frequencyType">
            <option value="" disabled hidden>Select Type</option>
            <option *ngFor="let freq of frequencyTypeOptions" [value]="freq.value">
              {{ freq.label }}
            </option>
          </select>
        </label>
        <label class="field">
          <span>Frequency Value</span>
          <input type="number" name="frequencyValue" [(ngModel)]="template.frequencyValue" placeholder="e.g., 30" />
        </label>
        <label class="field">
          <span>Grace Days</span>
          <input type="number" name="graceDays" [(ngModel)]="template.graceDays" placeholder="e.g., 5" />
        </label>

        <label class="field">
          <span>Time Unit</span>
          <select name="timeUnit" [(ngModel)]="template.timeUnit">
            <option *ngFor="let unit of timeUnitOptions" [value]="unit.value">
              {{ unit.label }}
            </option>
          </select>
        </label>
        <label class="field">
          <span>Meter Unit</span>
          <select name="meterUnit" [(ngModel)]="template.meterUnit">
            <option *ngFor="let unit of meterUnitOptions" [value]="unit.value">
              {{ unit.label }}
            </option>
          </select>
        </label>

        <label class="field">
          <span>Generate WOs Automatically? <span class="required-star">*</span></span>
          <select name="generateWOAutomatically" [(ngModel)]="template.generateWOAutomatically">
            <option value="" disabled hidden>Select</option>
            <option *ngFor="let option of generateOptions" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
        </label>
        <label class="field">
          <span>Lead Time to Generate WO (Days before due date)</span>
          <input type="number" name="leadTime" [(ngModel)]="template.leadTimeDays" />
        </label>
        <label class="field">
          <span>Linked Work Type</span>
          <select name="linkedWorkType" [(ngModel)]="template.linkedWorkType">
            <option value="" disabled hidden>Select Work Type</option>
            <option *ngFor="let workType of workTypeOptions" [value]="workType.value">
              {{ workType.label }}
            </option>
          </select>
        </label>

        <label class="field">
          <span>Default Priority</span>
          <select name="defaultPriority" [(ngModel)]="template.defaultPriority">
            <option value="" disabled hidden>Select Priority</option>
            <option *ngFor="let priority of priorityOptions" [value]="priority.value">
              {{ priority.label }}
            </option>
          </select>
        </label>
      </div>

      <div class="form-actions">
        <button type="button" class="btn ghost" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn primary" [disabled]="isSubmitting || !hasLoadedDetails">
          {{ isSubmitting ? (isEditMode ? 'Updating…' : 'Creating…') : (isEditMode ? 'Update PM Template' : 'Create PM Template') }}
        </button>
      </div>
    </form>
  </section>
</div>
