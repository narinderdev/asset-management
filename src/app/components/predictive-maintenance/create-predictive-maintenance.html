<div class="create-request-page">
  <section class="create-card">
    <header class="create-header">
      <button
        type="button"
        class="back-btn"
        aria-label="Back to predictive maintenance"
        (click)="onCancel()"
      >
        &larr;
      </button>
      <h2>{{ isEditMode ? 'Edit Predictive Maintenance' : 'Create Predictive Maintenance' }}</h2>
    </header>

    <div class="status-message" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form class="request-form" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <label class="field">
          <span>Asset <span class="required-star">*</span></span>
          <select name="assetId" [(ngModel)]="form.assetId" required>
            <option [ngValue]="null">Select Asset</option>
            <option *ngFor="let asset of assetOptions" [ngValue]="asset.id">
              {{ asset.label }}
            </option>
          </select>
        </label>

        <label class="field">
          <span>Meter Type</span>
          <select name="meterType" [(ngModel)]="form.meterType">
            <option *ngFor="let unit of meterTypeOptions" [value]="unit.value">
              {{ unit.label }}
            </option>
          </select>
        </label>

        <label class="field">
          <span>Warning Threshold</span>
          <input
            type="number"
            name="warningThreshold"
            [(ngModel)]="form.warningThreshold"
            step="0.01"
          />
        </label>

        <label class="field">
          <span>Critical Threshold</span>
          <input
            type="number"
            name="criticalThreshold"
            [(ngModel)]="form.criticalThreshold"
            step="0.01"
          />
        </label>

        <label class="field">
          <span>Default Priority</span>
          <select name="defaultPriority" [(ngModel)]="form.defaultPriority">
            <option *ngFor="let priority of priorityOptions" [value]="priority.value">
              {{ priority.label }}
            </option>
          </select>
        </label>

        <label class="field">
          <span>Cooldown Hours</span>
          <input
            type="number"
            name="cooldownHours"
            [(ngModel)]="form.cooldownHours"
            step="1"
            min="0"
          />
        </label>

        <label class="field checkbox-field">
          <span>Auto Create WO</span>
          <input type="checkbox" name="autoCreateWo" [(ngModel)]="form.autoCreateWo" />
        </label>
      </div>

      <div class="form-actions">
        <button type="button" class="btn ghost" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn primary" [disabled]="isSubmitting">
          {{ isSubmitting ? (isEditMode ? 'Updating...' : 'Saving...') : (isEditMode ? 'Update Predictive Maintenance' : 'Save Predictive Maintenance') }}
        </button>
      </div>
    </form>

    <div class="modal-backdrop" *ngIf="meterModalOpen">
      <div class="modal">
        <header class="modal-header">
          <h3>Enter Meter Reading</h3>
          
        </header>

        <div class="modal-grid">
          <label class="field">
            <span>Asset</span>
            <select name="meterAssetId" [(ngModel)]="meterReadingForm.assetId" disabled>
              <option [ngValue]="meterReadingForm.assetId">
                {{ selectedAssetLabel }}
              </option>
            </select>
          </label>

          <label class="field">
            <span>Meter Type</span>
            <select name="meterMeterType" [(ngModel)]="meterReadingForm.meterType" disabled>
              <option *ngFor="let unit of meterTypeOptions" [value]="unit.value">
                {{ unit.label }}
              </option>
            </select>
          </label>

          <label class="field">
            <span>Reading *</span>
            <input
              type="number"
              name="meterReadingValue"
              [(ngModel)]="meterReadingForm.readingValue"
              placeholder="00"
              required
            />
          </label>

          <label class="field">
            <span>Reading Time</span>
            <input
              type="datetime-local"
              name="meterReadingTime"
              [(ngModel)]="meterReadingForm.readingTime"
            />
          </label>

          <label class="field modal-notes">
            <span>Notes (optional)</span>
            <textarea
              name="meterNotes"
              [(ngModel)]="meterReadingForm.notes"
              placeholder="Optional note"
              rows="3"
            ></textarea>
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn ghost" (click)="closeMeterModal()">Cancel</button>
          <button type="button" class="btn primary" (click)="submitMeterReading()">Save &amp; Submit</button>
        </div>
      </div>
    </div>
  </section>
</div>
