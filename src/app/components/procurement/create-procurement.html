<div class="create-request-page">
  <section class="create-card">
    <header class="create-header">
      <button type="button" class="back-btn" aria-label="Back to procurement" (click)="onCancel()">
        &larr;
      </button>
      <h2>Create MR</h2>
    </header>

    <form class="request-form" (ngSubmit)="onCreate()">
      <div class="section-title">Create Material Requisition (MR)</div>
      <div class="form-grid">
        <label class="field">
          <span>Requested By (userId/name)</span>
          <input type="text" name="requestedBy" [(ngModel)]="requisition.requestedBy" placeholder="e.g., TM-102 / Shubham" />
        </label>
        <label class="field">
          <span>Needed By (optional)</span>
          <input type="date" name="neededBy" [(ngModel)]="requisition.neededBy" />
        </label>
        <label class="field">
          <span>Notes (optional)</span>
          <input type="text" name="notes" [(ngModel)]="requisition.notes" placeholder="Reason / job / project context..." />
        </label>
      </div>

      <div class="line-items">
        <div class="line-items-toolbar">
          <div class="section-title">Line Items</div>
          <button type="button" class="link-btn add-line-btn" (click)="addLineItem()">+ Add Line Item</button>
        </div>
        <div class="line-items-header">
          <div>Item Name (display)</div>
          <div>Item / Asset ID</div>
          <div>Qty</div>
          <div>UOM</div>
          <div class="actions-column">Actions</div>
        </div>

        <div class="line-item-row" *ngFor="let line of lineItems; let i = index">
          <div class="line-field">
            <select name="itemId-{{ i }}" [(ngModel)]="line.itemId" (change)="onItemSelected(i)">
              <option value="" disabled hidden>Select item</option>
              <option *ngFor="let option of itemOptions" [value]="option.id">
                {{ option.name }}
              </option>
            </select>
          </div>
          <div class="line-field">
            <input
              type="text"
              name="assetId-{{ i }}"
              [(ngModel)]="line.assetId"
              placeholder="e.g., ITEM-001 / ASSET-12"
            />
          </div>
          <div class="line-field">
            <input type="number" name="qty-{{ i }}" [(ngModel)]="line.qty" min="1" />
          </div>
          <div class="line-field">
            <input type="text" name="uom-{{ i }}" [(ngModel)]="line.uom" />
          </div>
          <div class="line-field actions-field">
            <button type="button" class="icon-btn" aria-label="Remove line" (click)="removeLineItem(i)"></button>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn primary" [disabled]="isSubmitting">Submit</button>
      </div>
    </form>
  </section>
</div>
