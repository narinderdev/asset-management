<div class="procurement-container">
  <div class="procurement-header">
    <h1 class="procurement-title">Material Requisitions</h1>
    <div class="header-actions">
      <select class="status-filter" [(ngModel)]="selectedStatus" (change)="filterRequests()">
        <option *ngFor="let status of statusOptions" [value]="status">
          {{ status === 'ALL' ? 'All statuses' : status }}
        </option>
      </select>
      <button class="create-service-btn" (click)="createRequisition()">+ Create MR</button>
    </div>
  </div>

  <div class="status-message" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="table-container">
    <div class="table-wrapper" *ngIf="!isLoading && filteredRequests.length; else loadingState">
      <table class="procurement-table">
        <thead>
          <tr>
            <th>MR Number</th>
            <th>Requested by</th>
            <th>Needed by</th>
            <th>Updated</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let request of filteredRequests">
            <td>{{ request.prId }}</td>
            <td>{{ request.requester }}</td>
            <td>{{ request.requiredBy }}</td>
            <td>{{ request.date }}</td>
            <td>
              <span class="status-chip" [ngClass]="statusClass(request.status)">
                {{ request.status }}
              </span>
            </td>
            <td class="actions-cell">
              <button class="action-icon" aria-label="View requisition" (click)="viewRequisition(request)">
                <img src="assets/icons/Vector.svg" alt="View" />
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <ng-template #loadingState>
      <ng-container *ngIf="isLoading; else emptyState">
        <div class="loading-wrapper">
          <div class="loading-overlay">
            <div class="loader"></div>
            <span>Loading purchase requisitions...</span>
          </div>
        </div>
      </ng-container>
      <ng-template #emptyState>
        <div class="empty-state">No material requisitions available.</div>
      </ng-template>
    </ng-template>
  </div>
</div>
