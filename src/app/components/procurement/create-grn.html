<div class="create-request-page">
  <section class="create-card">
    <header class="create-header">
      <button type="button" class="back-btn" aria-label="Back to goods receipt" (click)="cancel()">
        &larr;
      </button>
      <h2>Create GRN</h2>
    </header>

    <form class="request-form" (ngSubmit)="submit()">
      <div class="section-title">Goods Receipt Details</div>
      <div class="form-grid">
        <label class="field">
          <span>Received By</span>
          <input type="text" name="receivedBy" [(ngModel)]="form.receivedByUserId" required />
        </label>
        <label class="field">
          <span>Notes (optional)</span>
          <input type="text" name="notes" [(ngModel)]="form.notes" placeholder="Additional notes..." />
        </label>
      </div>

      <div class="line-items">
        <div class="line-items-toolbar">
          <div class="section-title">Items</div>
          <button type="button" class="link-btn add-line-btn" (click)="addLine()">+ Add Line</button>
        </div>
      <div class="line-items-header">
        <div>Inventory name</div>
        <div>Ordered Qty</div>
        <div>Received Qty</div>
        <div>Return Qty</div>
        <div class="actions-column">Actions</div>
      </div>

      <div class="line-item-row" *ngFor="let line of lines; let i = index">
        <div class="line-field">
          <select name="itemId-{{ i }}" [(ngModel)]="line.itemId" (change)="onItemSelected(i)">
            <option value="" disabled hidden>Select item</option>
            <option *ngFor="let option of itemOptions" [value]="option.id">
              {{ option.name }}
            </option>
          </select>
        </div>
        <div class="line-field">
          <input type="number" name="orderedQty-{{ i }}" [(ngModel)]="line.orderedQty" min="0" />
        </div>
        <div class="line-field">
          <input type="number" name="receivedQty-{{ i }}" [(ngModel)]="line.receivedQty" min="0" />
        </div>
        <div class="line-field">
          <input type="number" name="returnQty-{{ i }}" [(ngModel)]="line.returnQty" min="0" />
        </div>
        <div class="line-field actions-field">
          <button type="button" class="icon-btn" aria-label="Remove line" (click)="removeLine(i)"></button>
        </div>
      </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn ghost" (click)="cancel()">Cancel</button>
        <button type="submit" class="btn primary" [disabled]="isSubmitting || !form.receivedByUserId || !hasValidLine()">
          {{ isSubmitting ? 'Creating...' : 'Create GRN' }}
        </button>
      </div>
    </form>
  </section>
</div>
