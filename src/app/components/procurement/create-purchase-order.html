<div class="create-request-page">
  <section class="create-card">
    <header class="create-header">
      <button type="button" class="back-btn" aria-label="Back to purchase order" (click)="onCancel()">
        &larr;
      </button>
      <h2>Create Purchase Order</h2>
    </header>

    <form class="request-form" (ngSubmit)="onSubmit()">
      <div class="section-title">Purchase Order Details</div>
      <div class="form-grid">
        <label class="field">
          <span>Vendor</span>
          <select name="vendorId" [(ngModel)]="poInfo.vendorId" required>
            <option [ngValue]="null" disabled hidden>Select vendor</option>
            <option *ngFor="let vendor of vendorOptions" [ngValue]="vendor.id">
              {{ vendor.name }}
            </option>
          </select>
          <span class="helper" *ngIf="isLoadingVendors">Loading vendors...</span>
        </label>
        <label class="field">
          <span>Required Delivery Date</span>
          <input type="date" name="expectedDelivery" [(ngModel)]="poInfo.expectedDelivery" />
        </label>
        <label class="field">
          <span>GL Account</span>
          <input
            type="text"
            name="glAccountString"
            [(ngModel)]="poInfo.glAccountString"
            placeholder="Enter GL account (e.g., 5000-120-01)"
          />
        </label>
      </div>

      <!-- <div class="section-title">Material Requisition Info</div> -->
      <div class="form-grid form-grid-3">
        <label class="field">
          <span>Delivery Instruction</span>
          <input type="text" name="remarks" [(ngModel)]="poInfo.remarks" placeholder="Delivery instructions..." />
        </label>
        <label class="field">
          <span>Requested By (userId/name)</span>
          <input type="text" name="requestedBy" [(ngModel)]="requisition.requestedBy" placeholder="e.g., TM-102 / Shubham" />
        </label>
        <!-- <label class="field">
          <span>Need By</span>
          <input type="date" name="neededBy" [(ngModel)]="requisition.neededBy" />
        </label> -->
        <label class="field">
          <span>Notes (optional)</span>
          <input type="text" name="notes" [(ngModel)]="requisition.notes" placeholder="Reason / job / project context..." />
        </label>

        <label class="field">
          <span>Department</span>
          <input type="text" name="department" [(ngModel)]="requisition.department" placeholder="Enter department" />
        </label>

        <label class="field">
          <span>Shipping Location</span>
          <select name="shippingLocation" [(ngModel)]="requisition.shippingLocation">
            <option value="WAREHOUSE">Warehouse</option>
            <option value="WORK_SITE">Work site</option>
          </select>
        </label>

        <label class="field " *ngIf="requisition.shippingLocation === 'WAREHOUSE'">
          <span>Warehouse</span>
          <select name="shippingTargetId" [(ngModel)]="requisition.shippingTargetId">
            <option [ngValue]="null" disabled hidden>Select warehouse</option>
            <option *ngFor="let wh of warehouseOptions" [ngValue]="wh.id">{{ wh.name }}</option>
          </select>
        </label>

        <label class="field" *ngIf="requisition.shippingLocation === 'WORK_SITE'">
          <span>Work Order</span>
          <select name="shippingTargetId" [(ngModel)]="requisition.shippingTargetId">
            <option [ngValue]="null" disabled hidden>Select work order</option>
            <option *ngFor="let wo of workOrderOptions" [ngValue]="wo.id">{{ wo.name }}</option>
          </select>
        </label>
      </div>

      <div class="line-items">
        <div class="line-items-toolbar">
          <div class="section-title">Inventory Item</div>
          <button type="button" class="link-btn add-line-btn" (click)="addLineItem()">+ Add Inventory Item</button>
        </div>
        <div class="line-items-header">
          <div>Inventory name</div>
          <div>Item / Asset ID</div>
          <div>Order Quantity</div>
          <div>Unit Price</div>
          <!-- UOM column removed -->
          <div class="actions-column">Actions</div>
        </div>

        <div class="line-item-row" *ngFor="let line of lineItems; let i = index">
          <div class="line-field">
            <select name="itemId-{{ i }}" [(ngModel)]="line.itemId" (change)="onItemSelected(i)">
              <option value="" disabled hidden>Select item</option>
              <option *ngFor="let option of itemOptions" [value]="option.id">
                {{ option.name }}
              </option>
            </select>
          </div>
          <div class="line-field">
            <input
              type="text"
              name="assetId-{{ i }}"
              [(ngModel)]="line.assetId"
              placeholder="e.g., ITEM-001 / ASSET-12"
              [readonly]="!!line.itemId"
            />
          </div>
          <div class="line-field">
            <input type="number" name="qty-{{ i }}" [(ngModel)]="line.qty" min="1" />
          </div>
          <div class="line-field">
            <input type="number" name="unitPrice-{{ i }}" [(ngModel)]="line.unitPrice" min="0" step="0.01" />
          </div>
          <div class="line-field actions-field">
            <button type="button" class="icon-btn" aria-label="Remove line" (click)="removeLineItem(i)"></button>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn ghost" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn primary" [disabled]="isSubmitting || !poInfo.vendorId">
          {{ isSubmitting ? 'Creating...' : 'Create PO' }}
        </button>
      </div>
    </form>
  </section>
</div>
