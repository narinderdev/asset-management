<div class="procurement-container">
  <div class="procurement-header">
    <h1 class="procurement-title">Purchase Orders</h1>
    <div class="header-actions">
      <select class="status-filter" [(ngModel)]="selectedStatus" (change)="filterOrders()">
        <option *ngFor="let status of statusOptions" [value]="status">
          {{ status === 'ALL' ? 'All statuses' : status }}
        </option>
      </select>
      <button class="create-service-btn" type="button" (click)="createPurchaseOrder()">+ Create PO</button>
    </div>
  </div>

  <div class="status-message" *ngIf="errorMessage">{{ errorMessage }}</div>

  <div class="table-container">
    <div class="table-wrapper">
      <div class="table-container">
        <table class="procurement-table">
          <thead>
            <tr>
              <th>PO Number</th>
              <th>Vendor</th>
              <th>Expected Delivery</th>
              <th>Updated</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="!filteredOrders.length && !isLoading">
              <td colspan="6" class="empty-row">No purchase orders to display.</td>
            </tr>
            <tr *ngFor="let order of filteredOrders">
              <td>{{ order.poNumber }}</td>
              <td>{{ order.vendor }}</td>
              <td>{{ order.expectedDelivery }}</td>
              <td>{{ order.updatedAt }}</td>
              <td>
                <span class="status-chip" [ngClass]="statusClass(order.status)">
                  {{ order.status }}
                </span>
              </td>
              <td class="actions-cell">
                <button
                  class="action-icon"
                  aria-label="View purchase order"
                  (click)="viewOrder(order)"
                >
                  <img src="assets/icons/Vector.svg" alt="View" />
                </button>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <div class="loading-overlay" *ngIf="isLoading">
        <div class="loader"></div>
        <span>Loading purchase orders...</span>
      </div>
    </div>
  </div>
</div>
