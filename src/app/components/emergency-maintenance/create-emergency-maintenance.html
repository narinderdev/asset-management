<div class="create-request-page">
  <section class="create-card">
    <header class="create-header">
      <button
        type="button"
        class="back-btn"
        aria-label="Back to emergency maintenance"
        (click)="onCancel()"
      >
        &larr;
      </button>
      <h2>{{ isEditMode ? 'Edit Corrective Maintenance' : 'Create Corrective Maintenance' }}</h2>
    </header>

    <div class="status-message" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form class="request-form" (ngSubmit)="onSubmit()">
      <div class="form-grid">
        <label class="field">
          <span>Asset <span class="required-star">*</span></span>
          <select name="assetId" [(ngModel)]="form.assetId" (ngModelChange)="onAssetChange($event)" required>
            <option [ngValue]="null">Select Asset</option>
            <option *ngFor="let asset of assetOptions" [ngValue]="asset.id">
              {{ asset.label }}
            </option>
          </select>
        </label>

        <label class="field">
          <span>Location</span>
          <input
            type="text"
            name="location"
            [(ngModel)]="form.location"
            placeholder="e.g., Building 1 - Floor 2"
            [disabled]="true"
          />
        </label>

        <label class="field">
          <span>Failure Description <span class="required-star">*</span></span>
          <input name="failureDescription" [(ngModel)]="form.failureDescription" required rows="3"/>
        </label>

        <label class="field">
          <span>Failure Time <span class="required-star">*</span></span>
          <input type="datetime-local" name="failureTime" [(ngModel)]="form.failureTime" required />
        </label>

        <label class="field">
          <span>Reporter</span>
          <input type="text" name="reporter" [(ngModel)]="form.reporter" />
        </label>

        <label class="field checkbox-field">
          <span>Send Notification</span>
          <input type="checkbox" name="sendNotification" [(ngModel)]="form.sendNotification" />
        </label>
      </div>

      <div class="assignment-card">
        <div class="section-title">Assignment</div>
        <div class="assignment-toggle">
          <label>
            <input
              type="radio"
              name="assignmentMode"
              value="TECHNICIAN"
              [(ngModel)]="form.assignmentMode"
              (change)="onAssignmentModeChange('TECHNICIAN')"
            />
            Technician
          </label>
          <label>
            <input
              type="radio"
              name="assignmentMode"
              value="TEAM"
              [(ngModel)]="form.assignmentMode"
              (change)="onAssignmentModeChange('TEAM')"
            />
            Team
          </label>
        </div>

        <div class="assignment-grid">
          <label class="field" *ngIf="form.assignmentMode === 'TECHNICIAN'">
            <span>Select technician</span>
            <select name="assignedTechnicianId" [(ngModel)]="form.assignedTechnicianId" (ngModelChange)="onTechnicianChange($event)">
              <option [ngValue]="null">Select technician</option>
              <option *ngFor="let tech of technicianOptions" [ngValue]="tech.id">{{ tech.name }}</option>
            </select>
          </label>

          <label class="field" *ngIf="form.assignmentMode === 'TEAM'">
            <span>Select team</span>
            <select name="assignedTeamId" [(ngModel)]="form.assignedTeamId" (ngModelChange)="onTeamChange($event)">
              <option [ngValue]="null">Select team</option>
              <option *ngFor="let team of teamOptions" [ngValue]="team.id">{{ team.name }}</option>
            </select>
          </label>

          <label class="field">
            <span>Total Days Required to Complete</span>
            <input
              type="number"
              name="totalDaysRequired"
              min="1"
              step="1"
              [(ngModel)]="form.totalDaysRequired"
              (ngModelChange)="onTotalDaysChange($event)"
              placeholder="Enter total days"
            />
          </label>

          <label class="field">
            <span>Scheduled Date</span>
            <select
              name="preferredDate"
              [(ngModel)]="form.preferredDate"
              (ngModelChange)="onPreferredDateChange()"
              [disabled]="availabilityLoading || !availabilityDateOptions.length">
              <option [ngValue]="undefined" disabled hidden>Select date</option>
              <option *ngFor="let d of availabilityDateOptions" [ngValue]="d.value">{{ d.label }}</option>
            </select>
          </label>

          <label class="field">
            <span> Hours Required Per Day</span>
            <input
              type="number"
              name="totalHoursRequired"
              min="1"
              step="1"
              [(ngModel)]="form.totalHoursRequired"
              (ngModelChange)="onTotalHoursChange($event)"
              placeholder="Enter total hours"
            />
          </label>

          <label class="field">
            <span>Scheduled Time</span>
            <select
              class="form-input"
              [(ngModel)]="selectedAvailabilityIndex"
              name="selectedAvailabilityIndex"
              (ngModelChange)="onAvailabilitySelected($event)"
              [disabled]="availabilityLoading || !availabilityOptions.length">
              <option [ngValue]="undefined" disabled hidden>Select availability</option>
              <option *ngFor="let slot of availabilityOptions; index as i" [ngValue]="i">
                {{ slot.label }}
              </option>
            </select>
          </label>

          <label class="field">
            <span>Planner</span>
            <input type="text" name="planner" [(ngModel)]="form.planner" placeholder="Planner name" />
          </label>

          <label class="field full-width">
            <span>Pre-check Notes</span>
            <textarea name="preCheckNotes" [(ngModel)]="form.preCheckNotes" rows="3" placeholder="Add pre-check notes"></textarea>
          </label>
        </div>
      </div>

      <div class="materials-card">
        <div class="section-title">Planned Materials</div>
        <div class="materials-list">
          <div class="material-row" *ngFor="let mat of form.plannedMaterials; let i = index">
            <select name="material-{{ i }}" [(ngModel)]="mat.inventoryItemId">
              <option [ngValue]="null">Select item</option>
              <option *ngFor="let item of inventoryOptions" [ngValue]="item.id">{{ item.name }}</option>
            </select>
            <input type="number" min="1" [(ngModel)]="mat.quantity" name="qty-{{ i }}" />
            <input type="text" placeholder="Notes" [(ngModel)]="mat.notes" name="notes-{{ i }}" />
            <button type="button" class="icon-btn remove-btn" (click)="removeMaterial(i)" aria-label="Remove">×</button>
          </div>
        </div>
        <button type="button" class="btn ghost add-btn" (click)="addMaterial()">+ Add Material</button>
      </div>

      <div class="form-actions">
        <button type="button" class="btn ghost" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn primary" [disabled]="isSubmitting">
          {{ isSubmitting ? (isEditMode ? 'Updating...' : 'Saving...') : (isEditMode ? 'Update Corrective Maintenance' : 'Save Corrective Maintenance') }}
        </button>
      </div>
    </form>
  </section>
</div>
