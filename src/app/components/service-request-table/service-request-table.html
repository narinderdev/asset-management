<div class="wo-table-card">
  <div class="table-header">
    <h3 class="table-title">Pending Service Requests</h3>
  </div>

  <div class="table-wrapper">
    <table class="wo-table">
      <thead>
        <tr>
          <th>SR ID</th>
          <th>Title</th>
          <th>Asset</th>
          <th>Requester</th>
          <th>Request Date</th>
          <th>Priority</th>
          <th>Status</th>
          <th class="actions-col">Actions</th>
        </tr>
      </thead>
      <tbody>
        <ng-container *ngIf="loading">
          <tr *ngFor="let _ of loadingRows">
            <td colspan="8">
              <div class="skeleton-row"></div>
            </td>
          </tr>
        </ng-container>

        <ng-container *ngIf="!loading && rows.length">
          <tr *ngFor="let req of rows; trackBy: trackById">
            <td>{{ req.id }}</td>
            <td>{{ req.title }}</td>
            <td>{{ req.asset }}</td>
            <td>{{ req.requester || 'Unknown' }}</td>
            <td>{{ req.formattedRequestDate }}</td>
            <td>
              <span class="badge" [ngClass]="{
                'badge-high': req.priority === 'High',
                'badge-medium': req.priority === 'Medium',
                'badge-low': req.priority === 'Low'
              }">{{ req.priority }}</span>
            </td>
            <td>
              <span class="status-pill">{{ req.status }}</span>
            </td>
            <td class="actions-col">
              <div class="icon-group">
                <button class="icon-btn view-btn" type="button" (click)="viewRequest(req)" aria-label="View service request">
                  <img src="assets/icons/Vector.svg" alt="View" />
                </button>
                <button
                  class="icon-btn edit-btn"
                  type="button"
                  *ngIf="canEditRequests"
                  (click)="editRequest(req)"
                  aria-label="Edit service request"
                >
                  <img src="assets/icons/edit.svg" alt="Edit service request" />
                </button>
              </div>
            </td>
          </tr>
        </ng-container>

        <tr *ngIf="!loading && hasLoaded && !rows.length">
          <td colspan="8" class="empty-state">{{ emptyMessage }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
