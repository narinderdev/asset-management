<div class="create-request-page">
  <section class="create-card">
    <header class="create-header">
      <button
        type="button"
        class="back-btn"
        aria-label="Back to work orders"
        (click)="onCancel()"
      >
        ←
      </button>
      <h2>{{ isEditMode ? 'Edit Work Order' : 'Create Work Order' }}</h2>
    </header>

    <form class="request-form" (ngSubmit)="onCreate()">
      <div class="form-grid">
        <label class="field">
          <span>Work Order Type <span class="required-star">*</span></span>
          <select
            name="workOrderTypeId"
            [(ngModel)]="workOrder.workOrderTypeId"
            (ngModelChange)="onWorkOrderTypeChange($event)"
            required
          >
            <option [ngValue]="null" disabled hidden>Select Work Order Type</option>
            <option *ngFor="let type of workOrderTypeOptions" [ngValue]="type.id">
              {{ type.label }}
            </option>
          </select>
        </label>

        <label class="field" *ngIf="selectedWorkOrderTypeCreateAsset; else assetDropdownField">
          <span>Asset <span class="required-star">*</span></span>
          <input
            type="text"
            name="assetName"
            [(ngModel)]="workOrder.assetName"
            placeholder="Enter asset name"
            required
          />
        </label>
        <ng-template #assetDropdownField>
          <label class="field">
            <span>Asset <span class="required-star">*</span></span>
            <select name="assetId" [(ngModel)]="workOrder.assetId" (ngModelChange)="onAssetChange($event)" required>
              <option [ngValue]="null" disabled hidden>Select Asset</option>
              <option *ngFor="let asset of assetOptions" [ngValue]="asset.id">{{ asset.label }}</option>
            </select>
          </label>
        </ng-template>

        <label class="field">
          <span>Location</span>
          <input
            type="text"
            name="location"
            [(ngModel)]="workOrder.location"
            placeholder="Enter location"
            [disabled]="!selectedWorkOrderTypeCreateAsset && !!workOrder.assetId"
          />
        </label>
        <label class="field" *ngIf="selectedWorkOrderTypeCreateAsset">
          <span>Asset Serial Number</span>
          <input
            type="text"
            name="assetSerialNumber"
            [(ngModel)]="workOrder.assetSerialNumber"
            placeholder="Enter asset serial number"
          />
        </label>
        <label class="field" *ngIf="selectedWorkOrderTypeCreateAsset">
          <span>Asset Model Number</span>
          <input
            type="text"
            name="assetModelNumber"
            [(ngModel)]="workOrder.assetModelNumber"
            placeholder="Enter asset model number"
          />
        </label>
        <label class="field" *ngIf="selectedWorkOrderTypeCreateAsset">
          <span>Asset Manufacture Date</span>
          <input
            type="date"
            name="assetManufactureDate"
            [(ngModel)]="workOrder.assetManufactureDate"
          />
        </label>
        <label class="field">
          <span>Work Type <span class="required-star">*</span></span>
          <select name="workType" [(ngModel)]="workOrder.workType" required>
            <option value="" disabled hidden>Select Work Type</option>
            <option *ngFor="let workType of workTypeOptions" [value]="workType.value">{{ workType.label }}</option>
          </select>
        </label>
        <label class="field">
          <span>Priority <span class="required-star">*</span></span>
          <select name="priority" [(ngModel)]="workOrder.priority" required>
            <option value="" disabled hidden>Select Priority</option>
            <option *ngFor="let priority of priorityOptions" [value]="priority.value">{{ priority.label }}</option>
          </select>
        </label>
        <label class="field">
          <span>Work Request Type Code</span>
          <input
            type="text"
            name="workRequestTypeCode"
            [(ngModel)]="workOrder.workRequestTypeCode"
            placeholder="Enter request type code"
          />
        </label>

        <label class="field">
          <span>WO Title <span class="required-star">*</span></span>
          <input type="text" name="woTitle" [(ngModel)]="workOrder.woTitle" placeholder="Enter WO Title" required />
        </label>
        <label class="field">
          <span>GL Account</span>
          <input
            type="text"
            name="glAccount"
            [(ngModel)]="workOrder.glAccount"
            placeholder="Enter GL account"
          />
        </label>
        <label class="field">
          <span>Description Scope <span class="required-star">*</span></span>
          <input
            name="descriptionScope"
            [(ngModel)]="workOrder.descriptionScope"
            placeholder="Describe the issue or scope"
            required
          />
        </label>
        <label class="field">
          <span>Utility Account</span>
          <input
            type="text"
            name="utilityAccount"
            [(ngModel)]="workOrder.utilityAccount"
            placeholder="Enter utility account"
          />
        </label>

        <label class="field">
          <span>Target Completion Date <span class="required-star">*</span></span>
          <input
            type="date"
            name="targetCompletionDate"
            [(ngModel)]="workOrder.targetCompletionDate"
            required
          />
        </label>
        <label class="field">
          <span>Attachment</span>
          <input type="file" name="attachment" (change)="onAttachmentSelected($event)" accept="image/*,.pdf" />
        </label>
      </div>

      <div class="form-actions">
        <button type="button" class="btn ghost" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn primary">{{ isEditMode ? 'Update Work Order' : 'Create Work Order' }}</button>
      </div>
    </form>
  </section>
</div>
