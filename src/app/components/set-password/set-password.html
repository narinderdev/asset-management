<div class="set-password-container">
  <form class="set-password-card" [formGroup]="form" (ngSubmit)="submit()">
    <h2 class="title">Set Your Password</h2>
    <p class="subtitle">Create your password to complete your setup.</p>

    <!-- Show email being used -->
    <div class="email-info" *ngIf="email">
      <small
        >Setting password for: <strong>{{ email }}</strong></small
      >
    </div>

    <!-- Global error message -->
    <div class="error global-error" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>

    <div class="form-field">
      <label>Password <span class="color">*</span></label>
      <div class="input-wrapper">
        <input
          [type]="passwordVisible ? 'text' : 'password'"
          formControlName="password"
          placeholder="Enter new password"
        />
        <span
          class="input-icon icon-button"
          (click)="togglePasswordVisibility('password')"
          aria-label="Toggle password visibility"
        >
          <ng-container *ngIf="passwordVisible; else passwordHiddenIcon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path
                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                stroke="currentColor"
                fill="none"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <line
                x1="1"
                y1="1"
                x2="23"
                y2="23"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </ng-container>
          <ng-template #passwordHiddenIcon>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path
                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                stroke="currentColor"
                fill="none"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" fill="none" />
            </svg>
          </ng-template>
        </span>
      </div>
      <div class="error" *ngIf="submitted && form.get('password')?.errors">
        <span *ngIf="form.get('password')?.hasError('required')">Password is required.</span>
        <span *ngIf="form.get('password')?.hasError('minlength')">
          Password must be at least 8 characters.
        </span>
      </div>
    </div>

    <div class="form-field">
      <label>Confirm Password <span class="color">*</span></label>
      <div class="input-wrapper">
        <input
          [type]="confirmPasswordVisible ? 'text' : 'password'"
          formControlName="confirmPassword"
          placeholder="Confirm password"
        />
        <span
          class="input-icon icon-button"
          (click)="togglePasswordVisibility('confirmPassword')"
          aria-label="Toggle confirm password visibility"
        >
          <ng-container *ngIf="confirmPasswordVisible; else confirmPasswordHiddenIcon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path
                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                stroke="currentColor"
                fill="none"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <line
                x1="1"
                y1="1"
                x2="23"
                y2="23"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </ng-container>
          <ng-template #confirmPasswordHiddenIcon>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
              <path
                d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                stroke="currentColor"
                fill="none"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" fill="none" />
            </svg>
          </ng-template>
        </span>
      </div>
      <div class="error" *ngIf="submitted && form.get('confirmPassword')?.errors">
        Confirm Password is required.
      </div>
      <div class="error" *ngIf="submitted && form.errors?.['mismatch']">
        Passwords do not match.
      </div>
    </div>

    <button class="btn-primary" type="submit" [disabled]="loading || !email">
      <app-spinner *ngIf="loading"></app-spinner>
      <span *ngIf="!loading">Save Password</span>
    </button>
  </form>
</div>
