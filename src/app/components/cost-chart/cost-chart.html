<div class="chart-card">
  <h3 class="chart-title">Maintenance Cost Summary (Last 6 Months)</h3>
  
  <div class="bar-chart">
    <div class="y-axis">
      <div class="y-label">$60</div>
      <div class="y-label">$40</div>
      <div class="y-label">$20</div>
      <div class="y-label">0</div>
    </div>
    
    <div class="chart-area">
      <div class="grid-lines">
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
      </div>
      
      <div class="bars-container">
        <div class="bar-wrapper" *ngFor="let item of data; let i = index">
          <div
            class="bar"
            [style.height.%]="barHeight(item.value)"
            [style.--grow-delay]="(i * 0.1) + 's'"
          ></div>
          <div class="bar-label" [style.--label-delay]="(i * 0.1 + 0.35) + 's'">
            {{ item.month }}
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
