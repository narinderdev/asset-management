<div class="table-card">
  <!-- <h3 class="table-title">Recent Work Orders</h3> -->
  
  <div class="table-status" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div class="table-wrapper">
    <div class="table-container">
      <table class="work-order-table">
        <thead>
          <tr>
            <th>WO ID</th>
          <th>Title</th>
          <th>Asset</th>
          <th>Technician</th>
          <th>Due Date</th>
          <th>Priority</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="!workOrders.length && !isLoading">
          <td colspan="7" class="empty-row">No work orders to show.</td>
        </tr>
        <tr *ngFor="let order of workOrders">
          <td class="id-cell">{{ order.id }}</td>
          <td>{{ order.title }}</td>
          <td>{{ order.asset }}</td>
          <td>{{ order.technician }}</td>
          <td>{{ order.dueDate }}</td>
          <td>
            <span class="priority-badge" 
                  [class.priority-high]="order.priority === 'High'"
                  [class.priority-medium]="order.priority === 'Medium'"
                  [class.priority-low]="order.priority === 'Low'">
              {{ order.priority }}
            </span>
          </td>
          <td>
            <span class="status-badge"
                  [class.status-completed]="order.status === 'Completed'"
                  [class.status-progress]="order.status === 'In Progress'"
                  [class.status-pending]="order.status === 'Pending'">
              {{ order.status }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
    </div>

    <div class="loading-overlay" *ngIf="loadLive && isLoading">
      <div class="loader"></div>
      <span>Loading work orders...</span>
    </div>
  </div>

  <app-delete-modal
    [isOpen]="isDeleteModalOpen"
    title="Delete Work Order"
    message="Are you sure you want to delete this work order?"
    [deleting]="isDeleting"
    (cancel)="closeDeleteModal()"
    (confirm)="confirmDeleteWorkOrder()"
  ></app-delete-modal>
</div>
