<div class="roles-wrapper">
  <div class="roles-header">
    <h1 class="roles-title">Roles</h1>
    <button class="create-btn" type="button" (click)="openCreateRolePage()" *ngIf="canCreateRoles">
      + Add Role
    </button>
  </div>

  <div class="table-wrapper">
    <div class="table-container" *ngIf="!isLoading">
      <table class="roles-table">
        <thead>
          <tr>
            <th>Role Name</th>
            <th>Description</th>
            <th>Status</th>
            <th class="actions-col">Actions</th>
          </tr>
        </thead>

        <tbody>
          <!-- Mutually exclusive: rows OR empty -->
          <ng-container *ngIf="(pagedRoles?.length ?? 0) > 0; else emptyState">
            <tr *ngFor="let r of pagedRoles; trackBy: trackByRole">
              <td>{{ r.name || '-' }}</td>
              <td>{{ r.description || '-' }}</td>
              <td>
                <span
                  class="status-chip"
                  [ngClass]="{
                    'status-green': r.active !== false,
                    'status-grey': r.active === false
                  }"
                >
                  {{ r.active === false ? 'Inactive' : 'Active' }}
                </span>
              </td>
              <td class="actions-cell">
                <button class="action-icon" type="button" aria-label="View role" (click)="viewRole(r)">
                  <img src="/assets/icons/Vector.svg" alt="View role" />
                </button>
                <button class="action-icon" type="button" aria-label="Edit role" (click)="editRole(r)">
                  <img src="/assets/icons/edit.svg" alt="Edit role" />
                </button>
              </td>
            </tr>
          </ng-container>

          <ng-template #emptyState>
            <tr *ngIf="hasLoaded">
              <td colspan="3" class="empty-row">No roles to display.</td>
            </tr>
          </ng-template>
        </tbody>
      </table>
    </div>

    <app-loader [visible]="isLoading"></app-loader>
  </div>

  <div class="pagination" *ngIf="pagination.totalItems > 0">
    <span class="pager-info">
      Showing {{ displayStart }} - {{ displayEnd }} of {{ pagination.totalItems }}
    </span>

    <div class="pager-actions">
      <button
        class="pager-btn"
        (click)="previousPage()"
        [disabled]="pagination.currentPage === 0 || isLoading"
      >
        Previous
      </button>

      <span class="pager-info">Page {{ pagination.currentPage + 1 }} of {{ totalPages }}</span>

      <button
        class="pager-btn"
        (click)="nextPage()"
        [disabled]="pagination.currentPage >= totalPages - 1 || isLoading"
      >
        Next
      </button>
    </div>
  </div>
</div>
