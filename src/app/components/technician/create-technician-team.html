<div class="create-team-page">
  <section class="create-card">
    <header class="create-header">
      <button type="button" class="back-btn" aria-label="Back" (click)="onCancel()">
        &larr;
      </button>
      <h2>{{ isEditMode ? 'Edit Team' : 'Add Technician Team' }}</h2>
    </header>

    <div class="form-loading" *ngIf="isEditMode && isLoadingDetails">
      <div class="loading-indicator"></div>
      <span>Loading team details...</span>
    </div>

    <div *ngIf="errorMessage" class="form-error">
      {{ errorMessage }}
    </div>

    <form class="request-form" (ngSubmit)="onSubmit()" *ngIf="!isEditMode || !isLoadingDetails">
      <div class="form-grid">
        <label class="field">
          <span>Team Name</span>
          <input
            type="text"
            name="teamName"
            [(ngModel)]="form.teamName"
            required
            placeholder="Team Alpha"
          />
        </label>
        <label class="field">
          <span>Status</span>
          <select name="status" [(ngModel)]="form.status" required>
            <option value="" disabled hidden>Select Status</option>
            <option *ngFor="let option of statusOptions" [value]="option.value">
              {{ option.label }}
            </option>
          </select>
        </label>
        <label class="field">
          <span>Start Date</span>
          <input type="date" name="startDate" [(ngModel)]="form.startDate" />
        </label>
        <label class="field">
          <span>End Date</span>
          <input type="date" name="endDate" [(ngModel)]="form.endDate" />
        </label>
        <label class="field">
          <span>Team Description</span>
          <input type="text" name="teamDescription" [(ngModel)]="form.teamDescription" placeholder="Describe the team" />
        </label>
        <label class="field">
          <span>Notes</span>
          <input name="notes" [(ngModel)]="form.notes" placeholder="Add notes"/>
        </label>
        <label class="field custom-multiselect">
          <span>Team Members</span>
          <div
            class="multi-trigger"
            [class.disabled]="isLoadingTechnicians"
            (click)="toggleMemberDropdown()"
          >
            <span class="multi-text" [class.placeholder]="!form.technicianIds.length">
              {{ selectedMembersLabel }}
            </span>
            <span class="chevron" [class.open]="isMemberDropdownOpen"></span>
          </div>
          <div
            class="multi-panel"
            [class.has-selection]="form.technicianIds.length"
            *ngIf="isMemberDropdownOpen"
          >
            <div class="multi-header">
              <span>Select members</span>
              <button type="button" class="link-btn" (click)="closeMemberDropdown()">Done</button>
            </div>
            <div class="multi-option" *ngFor="let tech of technicianOptions">
              <label>
                <input
                  type="checkbox"
                  [checked]="form.technicianIds.includes(tech.id)"
                  (change)="toggleTechnicianSelection(tech.id, $event.target.checked)"
                />
                {{ tech.name }}
              </label>
            </div>
            <div class="multi-helper" *ngIf="isLoadingTechnicians">Loading technicians...</div>
            <div class="multi-helper" *ngIf="!isLoadingTechnicians && !technicianOptions.length">No technicians found</div>
          </div>
        </label>
        <label class="field">
          <span>Team Leader</span>
          <select name="teamLeaderId" [(ngModel)]="form.teamLeaderId" [disabled]="!selectedTechnicianOptions.length">
            <option [ngValue]="null" disabled hidden>Select leader</option>
            <option *ngFor="let tech of selectedTechnicianOptions" [ngValue]="tech.id">
              {{ tech.name }}
            </option>
          </select>
          <span class="helper" *ngIf="!selectedTechnicianOptions.length">Select team members to choose a leader</span>
        </label>
      </div>

      <div class="form-actions">
        <button type="button" class="btn ghost" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn primary" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Saving...' : 'Save Team' }}
        </button>
      </div>
    </form>
  </section>
</div>
