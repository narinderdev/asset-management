<form class="otp-form" (submit)="$event.preventDefault()">
  <div class="otp-container">
    <div class="otp-card">
      <h2 class="title">Verify Reset Code</h2>
      <p class="subtitle">
        We sent a 6-digit code to <span class="email">{{ email }}</span>. Enter it to continue.
      </p>

      <div class="otp-inputs">
        <input
          #otpInput
          *ngFor="let _ of code; let i = index; trackBy: trackByIndex"
          type="text"
          maxlength="1"
          inputmode="numeric"
          autocomplete="one-time-code"
          (input)="handleInput($event, i)"
          (keydown)="handleKeyDown($event, i)"
          (paste)="handlePaste($event, i)"
        />
      </div>

      <small class="error" *ngIf="errorMessage">{{ errorMessage }}</small>

      <button class="btn-verify" type="button" (click)="submit()" [disabled]="loading">
        <ng-container *ngIf="!loading; else loadingTpl">Verify Code</ng-container>
        <ng-template #loadingTpl>
          <app-spinner></app-spinner>
        </ng-template>
      </button>

      <button class="link-button" type="button" (click)="useDifferentEmail()">Use a different email</button>
    </div>
  </div>
</form>
